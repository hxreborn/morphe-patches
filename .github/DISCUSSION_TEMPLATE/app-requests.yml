labels: ["app request"]
body:
  - type: markdown
    attributes:
      value: |
        Before you post:

        - Check the [open requests](https://github.com/hxreborn/morphe-patches/discussions/categories/app-requests?discussions_q=is%3Aopen+category%3A%22App+Requests%22+sort%3Atop) first. If your app is there, upvote it instead of opening another one.
        - One app per request. Use the app's name as the title.
        - A bot checks every request. It links bundles that already patch the app, points out duplicates and asks for anything missing. You can have 3 requests open at a time.
        - Hobby project. Upvotes show demand. They don't set the order, and nothing is promised.
        - Features that depend on the app's servers (AI, cloud sync, streaming quality) may not be patchable.
          It varies by app, so ask if you're not sure.
  - type: input
    id: app_name
    attributes:
      label: App
      description: Full name of the app as shown on the Play Store, with a link.
      placeholder: Duolingo, https://play.google.com/store/apps/details?id=com.duolingo
    validations:
      required: true
  - type: input
    id: package_name
    attributes:
      label: Package name
      description: The Android package name, if you know it.
      placeholder: com.duolingo
    validations:
      required: false
  - type: textarea
    id: features
    attributes:
      label: Requested features
      description: What should the patch do? Name the locked features as the app names them.
      placeholder: |
        Unlimited hearts
        Offline lessons
        No ads between lessons
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional info
      description: Anything else useful, such as screenshots of the paywall.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched open and closed requests and this isn't a duplicate.
          required: true
        - label: I haven't requested this app from another patch bundle.
          required: true
        - label: I understand that features depending on the app's servers (AI, cloud sync, streaming quality) may not be patchable.
          required: true
        - label: This isn't about a region lock. A VPN handles that, a patch doesn't.
          required: true
