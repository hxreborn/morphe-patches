name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      discussions: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check regexes for Android
        run: python3 .github/scripts/check_android_regex.py

      - name: Check Java style
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:extension:checkstyle --no-daemon

      # Semantic release runs its own Gradle build command.
      # Only the main branch generates a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Close shipped app requests
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          discussion=.github/actions/triage/discussion.sh
          previous=$(git tag --sort=-v:refname | grep -vx "$TAG" | head -n 1)
          git show "$previous:patches-list.json" > "$RUNNER_TEMP/previous.json"
          bash -eo pipefail "$discussion" list app-requests > "$RUNNER_TEMP/requests.json"
          python3 .github/scripts/shipped_requests.py "$RUNNER_TEMP/previous.json" patches-list.json "$RUNNER_TEMP/requests.json" |
          while read -r row; do
            n=$(jq -r .number <<< "$row")
            app=$(jq -r .app <<< "$row")
            close=$(jq -r .close <<< "$row")
            printf '<!-- shipped-bot -->\nShipped in [%s](https://github.com/%s/releases/tag/%s). Update the bundle in Morphe Manager and patch %s.\n' \
              "$TAG" "$REPO" "$TAG" "$app" > "$RUNNER_TEMP/comment.md"
            if [ "$close" != true ]; then
              printf 'This request asks for several features, so it closes once every one of them is in.\n' >> "$RUNNER_TEMP/comment.md"
            fi
            bash -eo pipefail "$discussion" comment "$n" "$RUNNER_TEMP/comment.md" >/dev/null
            if [ "$close" != true ]; then
              echo "commented on #$n ($app), left open for its other features"
              continue
            fi
            if jq -e --argjson n "$n" '.[] | select(.number == $n) | (.labels // []) | map(.name) | index("in progress")' "$RUNNER_TEMP/requests.json" >/dev/null; then
              bash -eo pipefail "$discussion" remove-labels "$n" "in progress"
            fi
            bash -eo pipefail "$discussion" close "$n" RESOLVED
            echo "closed #$n ($app) as shipped in $TAG"
          done

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
