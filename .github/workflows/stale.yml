name: Close stale issues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: |
            **Marked stale after 30 days without activity.**
            It closes in 7 days unless someone comments.
          close-issue-message: |
            **Closed after 7 more days without activity.**
            If it still matters, comment below and a maintainer will reopen it.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-all-milestones: true
          exempt-issue-labels: "app request,needs info"
          operations-per-run: 30
      - uses: actions/stale@v11
        with:
          only-labels: "needs info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: |
            **Still waiting on the details asked for above.**
            It closes in 7 days without them.
          close-issue-message: |
            **Closed because the requested details never arrived.**
            Open a new issue with them, or comment below if this closure seems wrong.
          close-issue-reason: not_planned
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-issue-labels: "bad-triage"
          operations-per-run: 30
