name: Close stale issues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: >
            Nobody has posted here in 30 days, so I've marked this stale. It closes in 7 days
            unless someone comments. _I'm a bot._
          close-issue-message: >
            Closing this after a quiet month. _I'm a bot, so if this still matters, comment below and a
            maintainer will reopen it._
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-all-milestones: true
          exempt-issue-labels: "app request,needs info"
          operations-per-run: 30
      - uses: actions/stale@v11
        with:
          only-labels: "needs info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: >
            This still needs the info asked for above. I'll close it in 7 days if nobody adds it. _I'm a bot._
          close-issue-message: >
            Closing this because the missing info never arrived. Open a new issue with it filled in. _I'm a bot,
            so if I got this wrong, comment below and a maintainer will take a look._
          close-issue-reason: not_planned
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-issue-labels: "bad-triage"
          operations-per-run: 30
