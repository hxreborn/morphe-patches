name: Close stale issues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: |
            no activity for 30 days. it closes in 7 unless someone comments
          close-issue-message: |
            no activity for 37 days. comment if it still matters and it gets reopened
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-all-milestones: true
          exempt-issue-labels: "app request,needs info,app-update"
          operations-per-run: 30
      - uses: actions/stale@v11
        with:
          only-labels: "needs info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: |
            still waiting on the details asked for above. it closes in 7 days without them
          close-issue-message: |
            the requested details never arrived. open a new issue with them, or comment if this is wrong
          close-issue-reason: not_planned
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-issue-labels: "bad-triage"
          operations-per-run: 30
