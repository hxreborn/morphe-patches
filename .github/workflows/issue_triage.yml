name: Triage issues

on:
  issues:
    types: [opened, edited]
  discussion:
    types: [created, edited]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      issue-number:
        description: Preview triage for one bug or feature issue. Leave empty for the app request sweep.
        type: string
      dry-run:
        description: Print app request verdicts without acting on them
        type: boolean
        default: true

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.issue.number || github.event.discussion.number ||
    (inputs.issue-number != '' && format('preview-{0}', inputs.issue-number)) || 'sweep' }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.issue-number != ''
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/triage
        with:
          token: ${{ github.token }}
          preview-issue: ${{ inputs.issue-number }}

  triage:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.issue-number == '') ||
      (github.event_name == 'discussion' &&
       github.event.discussion.category.slug == 'app-requests' &&
       github.event.discussion.state == 'open' &&
       github.event.discussion.user.type != 'Bot' &&
       (github.event.action == 'created' ||
        (github.event.action == 'edited' && toJSON(github.event.changes.body) != 'null'))) ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'app-update') &&
       !contains(github.event.issue.labels.*.name, 'bot-wrong') &&
       github.event.issue.user.type != 'Bot' &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
       (github.event.action == 'opened' ||
        (github.event.action == 'edited' && github.event.issue.state == 'open' &&
         toJSON(github.event.changes.body) != 'null' &&
         contains(github.event.issue.labels.*.name, 'needs info')))) ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
       contains(github.event.issue.labels.*.name, 'enhancement') &&
       github.event.issue.user.type != 'Bot' &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'bug') &&
       !contains(github.event.issue.labels.*.name, 'bot-wrong') &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
       (github.event.action != 'edited' || toJSON(github.event.changes.body) != 'null') &&
       !(github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'incomplete')) &&
       (github.event.action == 'opened' ||
        contains(github.event.issue.labels.*.name, 'incomplete') ||
        contains(github.event.issue.labels.*.name, 'needs info') ||
        contains(github.event.issue.labels.*.name, 'untargeted version')))
    permissions:
      contents: read
      issues: write
      discussions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/triage
        with:
          token: ${{ github.token }}
          dry-run: ${{ inputs.dry-run || false }}

      - name: Read the issue after triage
        id: outcome
        if: github.event_name == 'issues' && github.event.action == 'opened'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          reviewable=$(gh api "repos/$REPO/issues/$ISSUE" --jq '
            .state == "open" and
            ([.labels[].name] | any(. == "app-update" or . == "bot-wrong" or . == "incomplete" or . == "needs info" or . == "untargeted version") | not)')
          echo "#$ISSUE: reviewable=$reviewable"
          echo "reviewable=$reviewable" >> "$GITHUB_OUTPUT"

      - name: Review issue
        if: steps.outcome.outputs.reviewable == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TRIAGE_MODE: ${{ vars.ISSUE_TRIAGE_MODE }}
          INCLUDE_MAINTAINERS: ${{ vars.ISSUE_TRIAGE_INCLUDE_MAINTAINERS }}
        with:
          script: |
            const run = require('./.github/scripts/issue-triage/triage.js');
            await run({ github, context, core });
