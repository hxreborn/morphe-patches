name: Reply to issue comments

on:
  issue_comment:
    types: [created]
  discussion_comment:
    types: [created]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.discussion.number }}
  cancel-in-progress: false

jobs:
  needs-info:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'needs info')
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/issue_comment.py
            .github/scripts/versions.py
            .github/actions/triage/replies.py
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          status=0
          python3 .github/scripts/issue_comment.py --needs-info "$GITHUB_EVENT_PATH" || status=$?
          [ "$status" -ne 3 ] || exit 0
          [ "$status" -eq 0 ] || exit "$status"
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label "needs info"

  reply:
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      !github.event.issue.locked &&
      github.event.comment.user.type != 'Bot' &&
      !contains(github.event.issue.labels.*.name, 'bot-wrong') &&
      !contains(github.event.issue.labels.*.name, 'incomplete') &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.issue.state == 'closed' ||
      contains(github.event.issue.labels.*.name, 'app-update') ||
      contains(github.event.issue.labels.*.name, 'enhancement'))
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/issue_comment.py
            .github/scripts/versions.py
            .github/actions/triage/replies.py
            patches-list.json
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          STATE: ${{ github.event.issue.state }}
        run: |
          unreleased=
          if [ "$STATE" = closed ]; then
            closing=$(gh api "repos/$REPO/issues/$ISSUE/timeline" --paginate \
              --jq '.[] | select(.event == "closed") | (.commit_id // "-")')
            commit=$(printf '%s\n' "$closing" | tail -n 1)
            if [ -n "$commit" ] && [ "$commit" != - ] && git cat-file -e "$commit^{commit}" 2>/dev/null; then
              tags=$(git tag --contains "$commit" | { grep -v -- - || [ $? -eq 1 ]; })
              [ -n "$tags" ] || unreleased=--unreleased
            fi
          fi
          status=0
          python3 .github/scripts/issue_comment.py $unreleased "$GITHUB_EVENT_PATH" patches-list.json > "$RUNNER_TEMP/comment.md" || status=$?
          [ "$status" -ne 3 ] || exit 0
          [ "$status" -eq 0 ] || exit "$status"
          marker=$(head -n 1 "$RUNNER_TEMP/comment.md")
          replied=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id")
          [ -z "$replied" ] || exit 0
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"

  request:
    if: >-
      github.event_name == 'discussion_comment' &&
      github.event.discussion.category.slug == 'app-requests' &&
      github.event.discussion.state == 'open' &&
      !github.event.discussion.locked &&
      github.event.comment.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      discussions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/issue_comment.py
            .github/scripts/versions.py
            .github/actions/triage/replies.py
            .github/actions/triage/discussion.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.discussion.number }}
          REPO: ${{ github.repository }}
        run: |
          discussion=.github/actions/triage/discussion.sh
          bash -eo pipefail "$discussion" view "$NUMBER" > "$RUNNER_TEMP/discussion.json"
          jq --slurpfile live "$RUNNER_TEMP/discussion.json" \
            '.issue = (.discussion + {labels: $live[0].labels})' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/request-event.json"
          labels=$(jq -r '.issue.labels[].name' "$RUNNER_TEMP/request-event.json")
          ! grep -qx bot-wrong <<< "$labels" || exit 0
          status=0
          python3 .github/scripts/issue_comment.py --needs-info "$RUNNER_TEMP/request-event.json" || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 3 ] || exit "$status"
          [ "$status" -ne 0 ] || bash -eo pipefail "$discussion" remove-labels "$NUMBER" "needs info"
          status=0
          python3 .github/scripts/issue_comment.py "$RUNNER_TEMP/request-event.json" > "$RUNNER_TEMP/comment.md" || status=$?
          [ "$status" -ne 3 ] || exit 0
          [ "$status" -eq 0 ] || exit "$status"
          marker=$(head -n 1 "$RUNNER_TEMP/comment.md")
          replied=$(jq -r --arg marker "$marker" \
            '.comments[] | select(.author.login == "github-actions" and (.body | contains($marker))) | .url' \
            "$RUNNER_TEMP/discussion.json")
          [ -z "$replied" ] || exit 0
          bash -eo pipefail "$discussion" comment "$NUMBER" "$RUNNER_TEMP/comment.md"
