name: 📱 App request
description: Request patches for an app not supported here yet.
title: "[App Request]: "
labels: ["app request"]
body:
  - type: markdown
    attributes:
      value: |
        # hxreborn Patches app request

        Before requesting an app, please keep the following in mind:

        - **Check the [existing requests](https://github.com/hxreborn/morphe-patches/issues?q=is%3Aissue+state%3Aopen+label%3A%22app+request%22+sort%3Areactions-%2B1-desc) first**: if your app is already there, upvote it with a 👍 reaction instead of opening a duplicate. Requests are ranked by 👍.
        - **This is a hobby project**: upvotes show me what's wanted, but they aren't a queue and I can't promise anything.
  - type: input
    id: app_name
    attributes:
      label: App
      description: Full name of the app as shown on the Play Store, with a link.
      placeholder: Duolingo, https://play.google.com/store/apps/details?id=com.duolingo
    validations:
      required: true
  - type: input
    id: package_name
    attributes:
      label: Package name
      description: The Android package name.
      placeholder: com.duolingo
    validations:
      required: true
  - type: textarea
    id: features
    attributes:
      label: Requested features
      description: List the specific features you want patched.
      placeholder: |
        - Unlock premium
        - Remove ads
        - Block telemetry
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional info
      description: Anything else that may help patch development.
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your app request will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed app requests and this is not a duplicate.
          required: true
        - label: I have checked that a suitable patch does not already exist on [another community bundle](https://morphe-patches.software/#apps).
          required: true
        - label: I understand that server-side features (AI, cloud sync, streaming quality) cannot be patched.
          required: true
        - label: This request is not for bypassing a region lock.
          required: true
