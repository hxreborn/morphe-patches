name: 📱 App request
description: Request patches for an app not supported here yet.
title: "[App Request]: "
labels: ["app request"]
body:
  - type: markdown
    attributes:
      value: |
        Before you ask:

        - Check [existing requests](https://github.com/hxreborn/morphe-patches/issues?q=is%3Aissue+state%3Aopen+label%3A%22app+request%22+sort%3Areactions-%2B1-desc) first. If yours is there, upvote it.
        - Hobby project. Upvotes aren't a queue and I can't promise anything.
        - I can only patch what the app decides on its own, not what the server enforces.
          MovieBox's SIM check was in the app, so it patched. Ask if you're not sure.
  - type: input
    id: app_name
    attributes:
      label: App
      description: Full name of the app as shown on the Play Store, with a link.
      placeholder: Duolingo, https://play.google.com/store/apps/details?id=com.duolingo
    validations:
      required: true
  - type: input
    id: package_name
    attributes:
      label: Package name
      description: The Android package name.
      placeholder: com.duolingo
    validations:
      required: true
  - type: dropdown
    id: features
    attributes:
      label: Requested features
      multiple: true
      options:
        - Unlock premium
        - Remove ads
        - Disable tracking
        - Bypass a check the app does locally
        - Something else, described below
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional info
      description: Anything else useful.
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched open and closed requests and this isn't a duplicate.
          required: true
        - label: I understand that features the server controls (AI, cloud sync, streaming quality) cannot be patched.
          required: true
