  - type: input
    id: app-version
    attributes:
      label: Other version
      description: Only if you picked "another version" above.
      placeholder: "15.1.0"
  - type: dropdown
    id: patches-version
    attributes:
      label: Patches version
      description: Newest first.
      options:
        # generated:versions
        - "1.60.0"
        - "1.60.0-dev.5"
        - "1.60.0-dev.4"
        - "1.60.0-dev.3"
        - "1.60.0-dev.2"
        - "1.60.0-dev.1"
        - "Older than these"
        # /generated
    validations:
      required: true
  - type: dropdown
    id: what-does-not-work
    attributes:
      label: What does not work
      options:
        - The app will not open at all
        - The app opens, then crashes
        - The patched feature is still locked or still shows ads
        - The patch has no visible effect
        - A patch is missing from the list in Manager
        - Something else the app used to do stopped working
    validations:
      required: true
  - type: dropdown
    id: unpatched-app
    attributes:
      label: Does the unpatched app do the same thing
      description: |
        Install the stock APK and try the same steps.
      options:
        - The unpatched app works fine, only the patched one fails
        - The unpatched app fails the same way
        - I have not tried the unpatched app
    validations:
      required: true
  - type: dropdown
    id: single-patch
    attributes:
      label: Does it still happen with only one patch selected
      description: |
        Patch again with only that one patch selected. If that build works, turn the others back
        on one at a time until it breaks.
      options:
        - Yes, it happens with only that one patch
        - No, that build works, and I picked the patch that breaks it below
        - I have not tried it
    validations:
      required: true
  - type: dropdown
    id: breaking-patch
