  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 6a, Android 14
    validations:
      required: true
  - type: input
    id: apk-source
    attributes:
      label: APK source
      description: |
        Link to the download if you have it. APKMirror, APKPure, Uptodown or APKCombo. Not
        apkmod, Softonic, HappyMod or anything else that repackages APKs.
      placeholder: APKMirror, https://www.apkmirror.com/...
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        # generated:abis
        - "arm64-v8a"
        - "armeabi-v7a"
        - "x86"
        - "x86_64"
        - "All of them (universal)"
        - "Don't know"
        # /generated
    validations:
      required: true
  - type: dropdown
    id: patched-with
    attributes:
      label: Patched with
      options:
        - Morphe Manager
        - morphe-cli
        - A Morphe-AutoBuilds APK
        - A pre-patched APK from somewhere else
    validations:
      required: true
  - type: dropdown
    id: optimize-architecture
    attributes:
      label: "\"Optimize for device architecture\" in Manager's Advanced settings"
      description: |
        Turn it off and repatch before reporting.
      options:
        - "Off"
        - "On"
        - I do not know
    validations:
      required: true
  - type: input
    id: other-bundles
    attributes:
      label: Other bundles enabled
      description: |
        Other patch sources you had enabled. Blank if none.
  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: |
        - What you did, what you expected, and what happened instead
        - Which screen or action triggers it
        - Screenshots or a screen recording if the problem is visible
        - A screenshot of the app's entry in Morphe Manager
        - Any patch settings you changed inside the app
    validations:
      required: true
  - type: textarea
    id: error-logs
    attributes:
      label: Error logs
      description: |
        Required when the app won't open or crashes. Run `adb logcat -d > log.txt` right after it fails and paste the file here.
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I repatched with the newest release of this bundle and it still happens.
          required: true
        - label: I uninstalled the app before installing the patched build.
          required: true
        - label: Nothing personal in my screenshots or logs.
          required: true
