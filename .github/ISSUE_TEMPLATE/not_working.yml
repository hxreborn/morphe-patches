name: 🔌 Patched app broken
description: The app patched fine, but it will not open, crashes, or the patch changed nothing.
title: "[Not working]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you file:

        - 🚨 Patching stopped with an error or the APK won't install: use
          [Patching failed](https://github.com/hxreborn/morphe-patches/issues/new?template=bug_report.yml).
        - Repatch on the newest release.
        - Install the unpatched APK and repeat the steps.
        - Search open and closed reports [here](https://github.com/hxreborn/morphe-patches/issues?q=is%3Aissue).
        - App version newer than the ones listed below: that's an
          [app update request](https://github.com/hxreborn/morphe-patches/issues/new?template=app_update.yml), not a bug.
  - type: dropdown
    id: app
    attributes:
      label: App and version
      description: The version is in the app's About screen.
