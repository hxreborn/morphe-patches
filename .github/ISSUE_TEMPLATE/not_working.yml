        # /generated
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 6a, Android 14
    validations:
      required: true
  - type: input
    id: apk-source
    attributes:
      label: APK source
      description: |
        Link to the download if you have it. APKMirror, APKPure, Uptodown or APKCombo. Not
        apkmod, Softonic, HappyMod or anything else that repackages APKs.
      placeholder: APKMirror, https://www.apkmirror.com/...
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        # generated:abis
        - "arm64-v8a"
        - "armeabi-v7a"
        - "x86"
        - "x86_64"
        - "All of them (universal)"
        - "Don't know"
        # /generated
    validations:
      required: true
  - type: dropdown
    id: patched-with
    attributes:
      label: Patched with
      options:
        - Morphe Manager
        - morphe-cli
        - A pre-patched APK from somewhere else
    validations:
      required: true
  - type: dropdown
    id: optimize-architecture
    attributes:
      label: "\"Optimize for device architecture\" in Manager's Advanced settings"
      description: |
        Turn it off and repatch before reporting.
      options:
        - "Off"
        - "On"
        - I do not know
    validations:
      required: true
  - type: input
    id: other-bundles
    attributes:
      label: Other bundles enabled
      description: |
        Other patch sources you had enabled. Blank if none.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from opening the app. Please name the screen and any patch setting you changed.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Please add the app's entry in Morphe Manager with its selected patches, and the problem on screen.
    validations:
      required: true
  - type: textarea
    id: error-logs
    attributes:
      label: Error logs
      description: |
        Run `adb logcat -d > log.txt` right after the problem and attach the file. Without a PC, record it with [LogFox](https://github.com/F0x1d/LogFox) and attach the export.
      placeholder: Drag the log file here, or paste a link to it (Pastebin, GitHub Gist).
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I repatched with the newest release of this bundle and it still happens.
          required: true
        - label: I uninstalled the app before installing the patched build.
          required: true
        - label: Nothing personal in my screenshots or logs.
          required: true
