name: 🐞 Patching failed
description: Patching stopped with an error, or the patched APK would not install.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this one when patching stopped with an error, or the APK it produced wouldn't install.

        - 🚨 Patching finished and the app misbehaves: use
          [Patched app broken](https://github.com/hxreborn/morphe-patches/issues/new?template=not_working.yml).
        - Search open and closed reports [here](https://github.com/hxreborn/morphe-patches/issues?q=is%3Aissue).
        - App version newer than the ones listed below: that's an
          [app update request](https://github.com/hxreborn/morphe-patches/issues/new?template=app_update.yml), not a bug.
        - A bot reads these fields when you submit and closes reports it can't act on. Edit the
          issue and it reopens.
  - type: dropdown
    id: what-happened
    attributes:
      label: What happened
      options:
        - Patching failed
        - Patching worked, install failed
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App and version
      description: The version is in the app's About screen.
