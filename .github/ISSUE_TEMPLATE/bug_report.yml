name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # hxreborn Patches bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports, including closed issues, [here](https://github.com/hxreborn/morphe-patches/issues?q=is%3Aissue).
        - **Include the app and version**: Patches break against specific app builds, so state which app version you patched.
  - type: input
    attributes:
      label: App version patched
      description: The app and the exact version you patched.
      placeholder: Proton Mail 7.10.4
    validations:
      required: true
  - type: input
    attributes:
      label: Patches version
      description: The bundle version you patched with.
      placeholder: "1.9.2"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - Describe your bug in detail
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
        - Add images and videos if possible
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: Exceptions can be captured by running `logcat | grep AndroidRuntime` in a shell.
      render: shell
  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: textarea
    attributes:
      label: Additional context
      description: Add additional context here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: All requested information has been provided properly.
          required: true
