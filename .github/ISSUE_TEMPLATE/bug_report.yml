    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Other version
      description: Only if you picked "another version" above.
      placeholder: "7.12.0"
  - type: dropdown
    id: patched-with
    attributes:
      label: Patched with
      options:
        - Morphe Manager
        - morphe-cli
        - A pre-patched APK from somewhere else
    validations:
      required: true
  - type: input
    id: apk-source
    attributes:
      label: APK source
      description: |
        Link to the download if you have it. APKMirror, APKPure, Uptodown or APKCombo. Not
        apkmod, Softonic, HappyMod or anything else that repackages APKs.
      placeholder: APKPure, https://apkpure.com/...
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        # generated:abis
        - "arm64-v8a"
        - "armeabi-v7a"
        - "x86"
        - "x86_64"
        - "All of them (universal)"
        - "Don't know"
        # /generated
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: |
        - What you did, what you expected, and what happened instead
        - Numbered steps that reach the failure
        - A screenshot or recording of the error
    validations:
      required: true
  - type: textarea
    id: error-logs
    attributes:
      label: Error logs
      description: |
        **Patching failed**: tap **Copy** on Morphe Manager's error dialog and paste it here.

        **Install failed**: paste the error the installer showed, and say whether the stock app
        was still installed at the time.

        **morphe-cli**: add `-r report.json` to the command and attach the report.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: Nothing personal in my screenshots or logs.
          required: true
