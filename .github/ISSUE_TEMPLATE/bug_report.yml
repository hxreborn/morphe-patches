name: 🐞 Patching or install failed
description: Patching stopped with an error, or the patched APK would not install.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this one when patching stopped with an error, or the APK it produced wouldn't install.

        - 🚨 App patched but misbehaves: use
          [Patched app does not work](https://github.com/hxreborn/morphe-patches/issues/new?template=not_working.yml).
        - Search open and closed reports [here](https://github.com/hxreborn/morphe-patches/issues?q=is%3Aissue).
        - A bot reads these fields when you submit and closes reports it can't act on. Edit the
          issue and it reopens.
  - type: dropdown
    id: what-happened
    attributes:
      label: What happened
      options:
        - Patching failed
        - Patching worked, install failed
    validations:
      required: true
  - type: dropdown
    id: app
