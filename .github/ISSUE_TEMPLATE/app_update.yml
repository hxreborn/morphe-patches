  - type: input
    id: version
    attributes:
      label: New version
      description: As shown on the download page or in the app's About screen.
      placeholder: "5.20.57.0"
    validations:
      required: true
  - type: input
    id: apk-source
    attributes:
      label: APK source
      description: |
        Link to the stock build. APKMirror, APKPure, Uptodown, APKCombo or APKCube. Not apkmod, Softonic,
        HappyMod or anything else that repackages APKs.
      placeholder: https://www.apkmirror.com/...
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Patching this version
      options:
        - Not tried
        - Patching fails
        - Patching works, the app misbehaves
        - Patching works and so does the app
    validations:
      required: true
  - type: textarea
    id: error-logs
    attributes:
      label: Error logs
      description: If patching failed, tap **Copy** on Morphe Manager's error dialog and paste it here.
      render: shell
