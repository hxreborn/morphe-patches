[versions]
morphe-patcher = "2.4.0"
morphe-patches-library = "2.2.0"
morphe-extensions-library = "2.1.0"
#noinspection GradleDependency
smali = "4220ae75f7"
okhttp = "5.5.1"
gson = "2.15.0"
pngj = "2.1.0"
kotlinx-coroutines = "1.11.0"
asm = "9.11.1"
spring-javaformat = "0.0.48"
junit = "4.13.2"
assertj = "3.27.7"
robolectric = "4.17"
json = "20260814"
androidx-annotation = "1.9.1"
androidx-compose = "1.7.6"
androidx-webkit = "1.16.0"
kotlin-stdlib = "2.4.21"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
pngj = { module = "ar.com.hjg:pngj", version.ref = "pngj" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
